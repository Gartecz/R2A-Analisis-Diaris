name: Update weekly analysis

on:
  push:
    branches: [main]
    paths:
      - "analisis/**/*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/build_weekly_report.py
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_reports.py
      - name: Commit weekly summary when changed
        run: |
          if git diff --quiet -- setmanals; then
            echo "No hi ha canvis setmanals."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setmanals
          git commit -m "weekly-analysis: $(date -u +%G-W%V)"
          git push
