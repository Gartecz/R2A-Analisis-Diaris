name: Validate daily analyses

on:
  push:
    paths:
      - "analisis/**/*.json"
  pull_request:
    paths:
      - "analisis/**/*.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_reports.py
