name: Validate daily analyses

on:
  push:
    paths:
      - "analisis/**/*.json"
      - "schema/**"
      - "scripts/validate_reports.py"
      - "requirements.txt"
      - ".github/workflows/validate-analyses.yml"
  pull_request:
    paths:
      - "analisis/**/*.json"
      - "schema/**"
      - "scripts/validate_reports.py"
      - "requirements.txt"
      - ".github/workflows/validate-analyses.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_reports.py
